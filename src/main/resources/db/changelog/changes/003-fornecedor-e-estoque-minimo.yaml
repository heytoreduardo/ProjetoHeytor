databaseChangeLog:

  - changeSet:
      id: 003-01-create-fornecedor
      author: curso-spring-2026
      changes:
        - createTable:
            tableName: fornecedor
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_fornecedor
                    nullable: false
              - column:
                  name: razao_social
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: cnpj
                  type: VARCHAR(14)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

  - changeSet:
      id: 003-02-unique-cnpj-fornecedor
      author: curso-spring-2026
      changes:
        - addUniqueConstraint:
            tableName: fornecedor
            columnNames: cnpj
            constraintName: uk_fornecedor_cnpj

  - changeSet:
      id: 003-03-check-status-fornecedor
      author: curso-spring-2026
      changes:
        - sql:
            sql: >
              ALTER TABLE fornecedor
              ADD CONSTRAINT ck_fornecedor_status
              CHECK (status IN ('ATIVO', 'INATIVO'));

  - changeSet:
      id: 003-04-add-estoque-minimo-produto
      author: curso-spring-2026
      changes:
        - addColumn:
            tableName: produto
            columns:
              - column:
                  name: estoque_minimo
                  type: NUMERIC(18,3)

  - changeSet:
      id: 003-05-fill-estoque-minimo-produto
      author: curso-spring-2026
      changes:
        - update:
            tableName: produto
            columns:
              - column:
                  name: estoque_minimo
                  valueNumeric: 0
            where: estoque_minimo IS NULL

  - changeSet:
      id: 003-06-not-null-estoque-minimo-produto
      author: curso-spring-2026
      changes:
        - addNotNullConstraint:
            tableName: produto
            columnName: estoque_minimo
            columnDataType: NUMERIC(18,3)

  - changeSet:
      id: 003-07-check-estoque-minimo-produto
      author: curso-spring-2026
      changes:
        - sql:
            sql: >
              ALTER TABLE produto
              ADD CONSTRAINT ck_produto_estoque_minimo
              CHECK (estoque_minimo >= 0);

  - changeSet:
      id: 003-08-add-fornecedor-produto
      author: curso-spring-2026
      changes:
        - addColumn:
            tableName: produto
            columns:
              - column:
                  name: fornecedor_id
                  type: BIGINT

  - changeSet:
      id: 003-09-fk-produto-fornecedor
      author: curso-spring-2026
      changes:
        - addForeignKeyConstraint:
            baseTableName: produto
            baseColumnNames: fornecedor_id
            referencedTableName: fornecedor
            referencedColumnNames: id
            constraintName: fk_produto_fornecedor
            onDelete: RESTRICT
